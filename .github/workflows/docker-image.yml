name: Docker Image

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-image.yml'

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: c4diagrams
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Montar a imagem de produção
        run: docker build -t c4diagrams:ci .

      # Sobe a imagem como em produção (migrações + servidor) e confere API, frontend e rota do React
      - name: Teste de fumaça da imagem
        run: |
          docker run -d --name c4 --network host \
            -e PORT=8080 \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/c4diagrams \
            -e JWT_SECRET=segredo_de_teste_do_ci_com_32_caracteres_ou_mais \
            -e JWT_EXPIRES_IN=1h \
            -e RESEND_API_KEY=re_fake_key_apenas_para_ci \
            -e EMAIL_FROM=onboarding@resend.dev \
            -e FRONTEND_URL=http://localhost:8080 \
            c4diagrams:ci
          npx wait-on http://localhost:8080/api/health --timeout 60000 || (docker logs c4; exit 1)
          curl -sf http://localhost:8080/api/health | grep '"database":"connected"'
          curl -sf http://localhost:8080/ | grep 'id="root"'
          curl -sf http://localhost:8080/projetos/qualquer | grep 'id="root"'

      # Regressão: com o Node 24.15 o agente do New Relic + o primeiro fetch estouravam o limite de canais de
      # diagnóstico do Node e derrubavam o processo (cadastro dava 502). Requisição de saída com o agente ligado.
      - name: Teste de regressão (New Relic + requisição HTTP de saída)
        run: |
          docker run --rm --network host \
            -e NEW_RELIC_LICENSE_KEY=chave_falsa_somente_para_o_teste_de_ci_000 \
            c4diagrams:ci node -e "require('./src/config/telemetry').startTelemetry(); fetch('http://localhost:8080/api/health').then((r) => { console.log('FETCH OK', r.status); process.exit(0); })" \
            | grep 'FETCH OK'
